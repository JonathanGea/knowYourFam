name: Angular MVP / Build

on:
  push:
    branches:
      - dev/fullstack-mvp
    paths:
      - "frontend/**"
      - ".github/workflows/angular-dev.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/angular-dev.yml"
  workflow_dispatch:

jobs:
  angular-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout authoritative HTML main for browser parity
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-reference
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Canvas engine parity smoke tests (no npm dependencies)
        run: node --experimental-strip-types --test scripts/*.test.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate production server syntax
        run: node --check server.mjs
      - name: Build application
        run: npm run build
      - name: Verify production static server and SPA routes
        run: npm run test:serve
      - name: Install browser test runner
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright
      - name: Install Chromium for UI parity
        run: npx playwright install --with-deps chromium
      - name: Compare main HTML and Angular in Chromium
        run: node scripts/browser-parity.mjs
      - name: Upload visual reference screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-angular-parity-screenshots
          path: frontend/artifacts/browser-parity
          if-no-files-found: ignore
